services:
  - type: web
    name: remember-companion
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: EMAIL_FROM
        value: Remember My Birthday <onboarding@resend.dev>
      - key: PORT
        value: "10000"
